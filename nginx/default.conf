proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=report_cache:10m max_size=1g inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    location /bionicpro-reports/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache report_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;

        # Инвалидация кеша. При истечении TTL nginx делает условный запрос 
        # к MinIO. Если отчёт перегенерирован кеш обновляется,
        # иначе отдаётся 304 и запись остаётся валидной без перекачивания тела.
        proxy_cache_revalidate on;
        proxy_cache_bypass $arg_nocache $http_x_purge_cache;
        proxy_no_cache $arg_nocache $http_x_purge_cache;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
