proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=report_cache:10m max_size=1g inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    # Проксирование запросов к MinIO с кешированием
    location /reports/ {
        proxy_pass http://minio:9000;  # MinIO работает на порту 9000
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Включаем кеширование
        proxy_cache report_cache;
        proxy_cache_valid 200 1h;      # Кешируем успешные ответы на 1 час
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Ограничиваем доступ: только GET и HEAD
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Для предотвращения долгого ожидания от MinIO
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Здоровье Nginx
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}